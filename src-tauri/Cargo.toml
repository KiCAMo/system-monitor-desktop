[package]
name = "system-monitor-desktop"
version = "0.1.0"
edition = "2021"
description = "Desktop monitor for EC2 docker logs with claude/codex PTY injection"
authors = ["KiCAMo"]

[lib]
name = "system_monitor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri core ---
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"

# --- Async runtime ---
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-util = "0.7"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# --- SSH / PTY ---
russh = "0.44"
russh-keys = "0.44"
portable-pty = "0.8"

# --- HTTP / regex / sqlite ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }

# --- Async trait helpers ---
async-trait = "0.1"
futures = "0.3"

# --- Logging / utilities ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
shellexpand = "3"
once_cell = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
