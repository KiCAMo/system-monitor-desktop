<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>시스템 모니터링</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">시스템 모니터링 <span class="ver" id="versionTag">v0.1.1</span></div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">idle</span></div>
    <button id="startBtn">트래킹 시작</button>
    <button id="stopBtn">트래킹 중단</button>
    <button id="historyBtn" class="gear" title="매칭 히스토리">📜</button>
    <button id="notifyBtn" class="gear" title="브라우저 알림 켜기">🔔</button>
    <button id="settingsBtn" class="gear" title="설정">⚙</button>
    <div class="meta" id="meta"></div>
  </header>

  <main class="grid">
    <section class="panel claude">
      <div class="panel-title">프롬프트 (에이전트 PTY)</div>
      <div id="claudeStream" class="xterm-host"></div>
    </section>

    <section class="panel dashboard">
      <div class="panel-title">시스템 진단 대시보드</div>
      <div id="dashRoot" class="dash-root"></div>
    </section>

    <section class="panel console">
      <div class="panel-title">도구 콘솔</div>
      <pre class="stream small" id="consoleStream"></pre>
    </section>

    <section class="panel ec2">
      <div class="panel-title">
        EC2 로그 (docker logs -f)
        <span class="tabs" id="ec2Tabs"></span>
      </div>
      <div id="ec2Streams"></div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
